name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/node-engineering-club/node-ros-2026

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: prod
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          # ignore-error: a cache export failure (e.g. "failed to reserve
          # cache" from concurrent writes to the same GHA cache scope, seen
          # when a PR-check build and a push build race each other) is not
          # a reason to fail the job -- the image itself still builds and
          # pushes correctly either way, caching is purely an optimization.
          cache-to: type=gha,mode=max,ignore-error=true
