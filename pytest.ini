[pytest]
# Scoped to the GUI packages on purpose.
#
# `testpaths = src` would also collect the competition packages, whose tests
# import rclpy and the ROS message packages and are run by `colcon test`. Sweeping
# them into a bare `pytest` would make the GUI's "runs with no ROS installed"
# promise fail on a laptop, and would make a ROS-dependent failure look like the
# GUI had broken the club's tests.
#
# Competition packages: `colcon test`. GUI packages: `pytest`. Both, always.
testpaths =
    src/asket_common
    src/asket_sim
    src/omniscan_bridge
    src/mission_recorder
    src/system_test
    src/gui_backend
python_files = test_*.py
addopts = -q
filterwarnings =
    error::DeprecationWarning:asket_.*
