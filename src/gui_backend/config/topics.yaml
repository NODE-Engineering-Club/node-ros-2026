# Where the backend finds real data.
#
# Nothing in gui_backend hard-codes a topic name or a message type. Pointing a
# stream at a different topic is a change to this file plus, at most, one adapter
# function in core/adapters.py.
#
# This file now names the **real** Njord interface (open question Q7, answered).
# The competition packages are not modified to suit the GUI: the GUI reads what
# they already publish.
#
# `adapter` names a function in gui_backend.core.adapters.

sources:
  gnss_fix:
    topic: /gps_driver/gps_raw
    type: sensor_msgs/msg/NavSatFix
  # The same fix in the map frame, from navsat_transform_node. Not used for the
  # map — the GUI draws geographically and takes the geographic fix directly,
  # so it does not depend on the datum being established. Kept because the
  # coverage overlay works in metres and this is already metres.
  odom_map:
    topic: /odometry/gps
    type: nav_msgs/msg/Odometry
    optional: true
  # Heading, speed and attitude, all from the EKF. One message, one timestamp:
  # the three cannot drift apart the way four MAVROS topics could.
  odom_filtered:
    topic: /odometry/filtered
    type: nav_msgs/msg/Odometry
  imu:
    topic: /imu_driver/imu_raw
    type: sensor_msgs/msg/Imu
    optional: true          # attitude falls back to the EKF pose
  # The Obstacles panel's raw/filtered toggle, backed by the real pair.
  lidar_scan:
    topic: /lidar_driver/scan_raw
    type: sensor_msgs/msg/LaserScan
    adapter: lidar_from_ros
  obstacles_lidar:
    topic: /obstacles/lidar
    type: sensor_msgs/msg/PointCloud2
    adapter: obstacles_from_pointcloud
  obstacles_fused:
    topic: /obstacles/fused
    type: sensor_msgs/msg/PointCloud2
    adapter: obstacles_from_pointcloud
    optional: true          # needs vision; absent when enable_vision:=false
  commanded_effort:
    topic: /control/effort
    type: geometry_msgs/msg/Twist
    optional: true
  pico_status:
    # std_msgs/String carrying raw firmware "STATE ..." lines, republished
    # verbatim and unparsed by pico_bridge. The parser is in
    # core/pico_state.py and its format is PROVISIONAL — nobody has captured a
    # real line yet, and the pre-flight says so on every run.
    topic: /pico/status
    type: std_msgs/msg/String
    adapter: pico_from_ros
  sonar_status:
    # The Omniscan bridge is part of the GUI overlay, so this one is known.
    topic: /sonar/status
    type: asket_interfaces/msg/SonarStatus
    adapter: sonar_from_ros
  mission_state:
    topic: /mission/state
    type: asket_interfaces/msg/MissionState
    optional: true
  diagnostics:
    topic: /diagnostics
    type: diagnostic_msgs/msg/DiagnosticArray

# Where commands go. Mode requests reach the Pico through pico_bridge, which
# this repository does not modify, so the interface is named here.
  # Firmware acknowledgements: `[ACK] MODE MANUAL rejected rc_clamp`. Without
  # this a refused command looks identical to a slow one — the button just
  # times out saying nothing happened, which is true but not the reason.
  pico_command_ack:
    topic: /pico/command_ack
    type: std_msgs/msg/String

commands:
  mode_request:
    topic: /pico/mode_request
    type: std_msgs/msg/String
    # pico_bridge accepts these words. ESTOP became real when the firmware
    # gained `CMD MODE ESTOP`; RELEASE stops holding a request and lets it
    # expire, which is how authority goes back to channel 8.
    #
    # AUTONOMOUS is listed but is refused by the firmware while
    # SOFTWARE_UPWARD_REQUESTS_ALLOWED is 0 — the refusal comes back as
    # `[ACK] MODE AUTONOMOUS rejected upward_disabled` and is shown to the
    # operator. The GUI does not offer it as a button; see
    # asket_common.mode_arbitration.requestable_modes().
    accepts: ["AUTO", "AUTONOMOUS", "MANUAL", "ESTOP", "RELEASE"]
  set_ping_parameters:
    service: /omniscan_bridge/set_ping_parameters
    type: asket_interfaces/srv/SetPingParameters
  start_mission:
    service: /mission_recorder/start_mission
    type: asket_interfaces/srv/StartMission
  stop_mission:
    service: /mission_recorder/stop_mission
    type: asket_interfaces/srv/StopMission
  run_system_test:
    service: /system_test/run
    type: asket_interfaces/srv/RunSystemTest

# What "Cut propulsion" actually does.
#
# There is no software ESTOP anywhere in this stack: pico_bridge accepts AUTO
# and MANUAL and nothing else, and the firmware has no MODE ESTOP. So the button
# cannot cut propulsion, and it must not pretend to.
#
# The safest thing available is to drop the Pico out of AUTONOMOUS. Per
# pico_bridge's own docstring the Pico applies motor commands only when armed
# AND in AUTONOMOUS, so requesting MANUAL removes software authority over the
# thrusters and hands the boat back to the RC pilot. It does NOT stop the boat.
#
# The GUI labels the button with what this actually does. Changing it to a real
# ESTOP needs a firmware change and a pico_bridge change, and that decision is
# not this repository's to make (see README, "Two things that are not settled").
estop:
  # The firmware now has a real software ESTOP: `CMD ESTOP` opens the ESC-power
  # relay (GPIO21) and sets the latch, and it is accepted from any state,
  # whatever channel 8 is doing. So the button no longer has to be labelled
  # around a capability the vessel lacked.
  mode: mode_request_estop
  label: "Cut propulsion"
  effect: >-
    Opens the ESC power relay and latches. This does cut propulsion. It is a
    software path and it is not the emergency stop: the hardware killswitch and
    RC channel 8 remain the only cuts that do not depend on firmware, and
    nothing verifies the rail actually collapsed while ESTOP_FEEDBACK_ENABLED is
    0. Re-arming stays blocked until the operator cycles the arm switch or
    selects ESTOP on channel 8.

# Battery capacity, needed to turn a percentage into an endurance estimate.
# PROVISIONAL (Q5).
vessel:
  battery_capacity_wh: 1200.0
  hotel_load_w: 85.0

# The GUI's own server. 8090 stays clear of foxglove_bridge (8765) and of the
# rosbridge (9090) and web_video_server (8080) entries in njord.launch.py.
# 0.0.0.0 because the whole point is reaching it from a laptop on the beach.
server:
  host: 0.0.0.0
  port: 8090
