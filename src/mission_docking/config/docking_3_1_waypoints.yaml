# Real on-site-captured GPS points for Task 3.1, supplied by the team
# 2026-08-12.
#
# Per the Njord 2026 spec (9.3 Docking), Task 3.1 uses three GPS points:
#   point_7_start:   official start line, ~10 m from the berth. NOT
#                    navigated to by this mission — the boat is expected to
#                    already be there when docking_mission is launched.
#                    Kept here for reference only.
#   point_8_staging: the mission drives here first (plain GPS transit via
#                    mission_manager), then hands off to the existing
#                    LiDAR-based docking approach (boat_bt's ExecuteDocking).
#   point_9_finish:  driven to after a successful dock + undock. Reaching
#                    this point is what stops the task's timer per spec.
task: docking_3_1

points:
  point_7_start:
    latitude: 63.4411868406
    longitude: 10.4239389212
    altitude: 0.0
  point_8_staging:
    latitude: 63.4411738814
    longitude: 10.4242062185
    altitude: 0.0
  point_9_finish:
    latitude: 63.4410865264
    longitude: 10.4241096050
    altitude: 0.0
