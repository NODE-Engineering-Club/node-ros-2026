omniscan_bridge:
  ros__parameters:
    # The sonar's address. Overridden to 127.0.0.1 when sim:=true, where
    # asket_sim serves real Ping Protocol frames on a real socket.
    host: "192.168.2.92"
    port: 62312
    transport: "udp"

    frame_id: "base_link"

    # NOTE: there is deliberately no ntp_url here. Cerulean REMOVED the
    # Omniscan 3D's SET_NTP_INFO packet; the NTP server is configured on the
    # device itself and defaults to an internet host. There is no internet in
    # the field, so if that step is missed the sonar's clock is wrong and every
    # mission is un-georeferenceable. The bridge cannot fix it — it measures
    # clock_offset_ms and shouts. See docs/SETUP.md.

    # PROVISIONAL (Q1): depth profile in Namibia unknown. Adjustable at runtime
    # from the GUI via ~/set_ping_parameters — the range is meant to be tuned
    # on site, not fixed at launch.
    range_m: 30.0
    # -1 is auto gain, which is Cerulean's recommendation. 0..10 is manual.
    gain_index: -1
    ping_rate_hz: 5.0
    speed_of_sound: 1500.0
    # Range resolution in steps; must be 200..1000 inclusive.
    n_range_steps: 400

    # The GUI is not a sonar analysis tool, so the point cloud is rate-limited
    # for RViz and debugging. Health accounting still sees every ping.
    max_publish_rate_hz: 20.0
    drain_rate_hz: 100.0

    use_vessel_attitude: true

    # Mounting geometry is NOT here. It lives in mounting.yaml, which carries
    # its own "has anybody measured this" flag and is read by the pre-flight
    # check as well as by this node. Leave empty to fall back to the built-in
    # defaults — which the pre-flight will then report as a warning, loudly and
    # every time. See docs/open_questions.md Q2.
    mounting_path: ""
